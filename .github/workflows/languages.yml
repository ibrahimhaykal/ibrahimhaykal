name: Language card

# Setup:
# 1. Create a scope-less personal access token (no checkboxes needed —
#    this only reads public repository data).
# 2. Save it as a repository secret named METRICS_TOKEN.
# 3. Create the `output` branch if it does not exist yet:
#      git switch --orphan output && git commit --allow-empty -m init && git push -u origin output
# 4. Run this workflow manually once from the Actions tab.

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Light card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ibrahimhaykal
          filename: languages.svg
          committer_branch: output
          committer_message: "chore: regenerate language card"
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, scss, blade, hack, dockerfile

      - name: Dark card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ibrahimhaykal
          filename: languages-dark.svg
          committer_branch: output
          committer_message: "chore: regenerate language card (dark)"
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, scss, blade, hack, dockerfile
          extras_css: |
            :root {
              --color-text: #c9d1d9;
              --color-calendar-graph-day-bg: #161b22;
            }
            .background { fill: transparent; }
            h2, .title { color: #c9d1d9; }
